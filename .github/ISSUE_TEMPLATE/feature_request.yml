name: Feature request / 功能建议
description: Describe the smallest useful improvement and its permission boundary
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and current workaround
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed behavior, permission changes and safe acceptance tests
    validations:
      required: true
  - type: markdown
    attributes:
      value: "A feature request does not authorize a live Webhook, permission expansion, source merge, publication or deployment."
