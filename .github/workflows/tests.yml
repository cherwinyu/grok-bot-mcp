name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and scan one release candidate; stage that exact wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install "build==1.2.2"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip wheel . --wheel-dir "$env:RUNNER_TEMP/wheelhouse"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $releaseWheels = @(Get-ChildItem dist/grokbot_mcp_bridge-*.whl)
          if ($releaseWheels.Count -ne 1) { throw "Expected exactly one audited wheel" }
          $releaseWheel = $releaseWheels[0]
          $installedWheel = Join-Path "$env:RUNNER_TEMP/wheelhouse" $releaseWheel.Name
          Copy-Item -LiteralPath $releaseWheel.FullName -Destination $installedWheel -Force
          $releaseHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releaseWheel.FullName).Hash
          $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedWheel).Hash
          if ($releaseHash -ne $installedHash) { throw "Release wheel differs from selected installed wheel" }
          python scripts/verify_beta_assets.py --root . --wheelhouse "$env:RUNNER_TEMP/wheelhouse"
          exit $LASTEXITCODE
      - name: Installed final release wheel - all Windows tests and MCP stdio
        shell: pwsh
        run: python scripts/verify_wheel.py --wheelhouse "$env:RUNNER_TEMP/wheelhouse" --output "$env:RUNNER_TEMP/reliability-evidence"
      - name: Native fictional two-installation client acceptance
        shell: pwsh
        run: python scripts/native_deployment_acceptance.py --wheelhouse "$env:RUNNER_TEMP/wheelhouse" --output "$env:RUNNER_TEMP/reliability-evidence"
      - name: Memory-only offline demo
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          python -I -X utf8 -m grokbot_mcp.safety_cli demo > "$env:RUNNER_TEMP/reliability-evidence/offline-demo.json"
          $status = $LASTEXITCODE
          Pop-Location
          exit $status
      - name: Scan the exact final release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = (Get-ChildItem dist/grokbot_mcp_bridge-*.whl).FullName
          $sdist = (Get-ChildItem dist/grokbot_mcp_bridge-*.tar.gz).FullName
          $source = (Get-ChildItem dist/grokbot-mcp-bridge-*-source.zip).FullName
          python scripts/scan_release.py --root . --archive "$wheel" --archive "$sdist" --archive "$source"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m scripts.scan_nested_delivery --root . --archive "$wheel"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content -Raw dist/SHA256SUMS.txt
          Get-Content -Raw "$env:RUNNER_TEMP/reliability-evidence/wheel-summary.json"
      - name: Bounded private Git inventory - never release clearance
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          python scripts/audit_publication.py --repository . --revision "$head" --history --all-refs --private-candidate --output "$env:RUNNER_TEMP/private-beta-audit"
          exit $LASTEXITCODE
      - name: Upload only inspected candidate release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-candidate-assets
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*-source.zip
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
