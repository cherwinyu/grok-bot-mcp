name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel and install it from the wheelhouse
        shell: pwsh
        run: |
          python -m pip wheel . --wheel-dir "$env:RUNNER_TEMP/wheelhouse"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-index --find-links "$env:RUNNER_TEMP/wheelhouse" grokbot-mcp-bridge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installed-wheel unittest outside the source tree
        shell: pwsh
        run: python scripts/verify_wheel.py --wheelhouse "$env:RUNNER_TEMP/wheelhouse" --output "$env:RUNNER_TEMP/reliability-evidence"
      - name: Fictional two-installation client acceptance
        shell: pwsh
        run: python scripts/native_deployment_acceptance.py --wheelhouse "$env:RUNNER_TEMP/wheelhouse" --output "$env:RUNNER_TEMP/reliability-evidence"
      - name: Memory-only offline demo
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          python -I -X utf8 -m grokbot_mcp.safety_cli demo > "$env:RUNNER_TEMP/reliability-evidence/offline-demo.json"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: Scan source tree, source archive, sdist and wheel
        shell: pwsh
        run: |
          python -m pip install "build==1.2.2"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP/wheelhouse/grokbot_mcp_bridge-*.whl").FullName
          python scripts/scan_release.py --root . --archive $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m scripts.scan_nested_delivery --root . --archive $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content -Raw dist/SHA256SUMS.txt
          Get-Content -Raw "$env:RUNNER_TEMP/reliability-evidence/wheel-summary.json"
